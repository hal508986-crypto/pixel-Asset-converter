name: License audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-audit:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pinned runtime, GUI, and test dependencies
        run: python -m pip install --disable-pip-version-check -c requirements-license-audit.txt -e ".[gui,dev]"
      - name: Verify generated license inventory and policy gate
        run: python scripts/generate_licenses.py --check
